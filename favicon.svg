<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Fondo redondeado -->
  <rect width="32" height="32" rx="7" fill="#000814"/>

  <g transform="translate(16,16)">
    <!-- 6 brazos del copo -->
    <g transform="rotate(0)">
      <polygon points="0,-13 -4,-8.5 -3,-5 3,-5 4,-8.5" fill="#0c1f3f" stroke="#1a4a8a" stroke-width="0.6"/>
      <line x1="0" y1="-12" x2="0" y2="-6" stroke="#3b9eff" stroke-width="1.1"/>
    </g>
    <g transform="rotate(60)">
      <polygon points="0,-13 -4,-8.5 -3,-5 3,-5 4,-8.5" fill="#0c1f3f" stroke="#1a4a8a" stroke-width="0.6"/>
      <line x1="0" y1="-12" x2="0" y2="-6" stroke="#3b9eff" stroke-width="1.1"/>
    </g>
    <g transform="rotate(120)">
      <polygon points="0,-13 -4,-8.5 -3,-5 3,-5 4,-8.5" fill="#0c1f3f" stroke="#1a4a8a" stroke-width="0.6"/>
      <line x1="0" y1="-12" x2="0" y2="-6" stroke="#3b9eff" stroke-width="1.1"/>
    </g>
    <g transform="rotate(180)">
      <polygon points="0,-13 -4,-8.5 -3,-5 3,-5 4,-8.5" fill="#0c1f3f" stroke="#1a4a8a" stroke-width="0.6"/>
      <line x1="0" y1="-12" x2="0" y2="-6" stroke="#3b9eff" stroke-width="1.1"/>
    </g>
    <g transform="rotate(240)">
      <polygon points="0,-13 -4,-8.5 -3,-5 3,-5 4,-8.5" fill="#0c1f3f" stroke="#1a4a8a" stroke-width="0.6"/>
      <line x1="0" y1="-12" x2="0" y2="-6" stroke="#3b9eff" stroke-width="1.1"/>
    </g>
    <g transform="rotate(300)">
      <polygon points="0,-13 -4,-8.5 -3,-5 3,-5 4,-8.5" fill="#0c1f3f" stroke="#1a4a8a" stroke-width="0.6"/>
      <line x1="0" y1="-12" x2="0" y2="-6" stroke="#3b9eff" stroke-width="1.1"/>
    </g>

    <!-- Círculo central -->
    <circle r="4.5" fill="#060e20" stroke="#1a4a8a" stroke-width="1.2"/>
    <circle r="4.5" fill="none" stroke="#3b9eff" stroke-width="0.6" opacity="0.7"/>
    <circle r="2.5" fill="#0a1830"/>
  </g>
</svg>
